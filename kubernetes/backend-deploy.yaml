apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: spring-boot-backend
  name: spring-boot-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-boot-backend
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: spring-boot-backend
    spec:
      containers:
      - image: nginx:alpine
        name: nginx
        env: 
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://mysql:3306/testdb?useSSL=false&allowPublicKeyRetrieval=true"
        - name: SPRING_DATASOURCE_USERNAME
          value: "root"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "12345678"
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: "update"
        ports:
        - containerPort: 8080
        resources: {}
status: {}
